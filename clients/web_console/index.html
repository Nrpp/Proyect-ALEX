<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ALEX // Console</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#04070a" />
<!-- iOS ignores the manifest above for home-screen install metadata (Safari-only
     quirk) - these three tags are what it actually reads. apple-touch-icon must be
     a PNG, not SVG or the manifest's own icons. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ALEX" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<style>
  :root{
    --bg:#04070a;
    --bg2:#070d13;
    --panel:#0a131a;
    --line: rgba(34, 232, 255, 0.18);
    --cyan:#22e8ff;
    --cyan-dim:#0f8fa8;
    --text:#d8faff;
    --muted:#5c7a86;
    --amber:#ffb020;
    --red:#ff3b5c;
    --green:#31ffb0;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 800px at 50% -10%, rgba(34,232,255,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--text);
    font-family: var(--mono);
    overflow:hidden;
  }
  ::selection{ background: rgba(34,232,255,0.3); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--cyan-dim); border-radius:4px; }

  .glow-text{ text-shadow: 0 0 6px currentColor, 0 0 18px currentColor; }

  /* ---------------- Connect screen ---------------- */
  #connect-screen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:22px; z-index:50;
  }
  #connect-screen .brand{
    font-size:15vw; line-height:1; letter-spacing:0.15em; color:var(--cyan);
    font-weight:700;
  }
  @media (min-width: 700px){ #connect-screen .brand{ font-size:96px; } }
  #connect-screen .sub{ color:var(--muted); letter-spacing:0.35em; font-size:11px; margin-top:-14px; }
  .conn-form{
    display:flex; flex-direction:column; gap:12px; width:min(360px, 88vw);
    border:1px solid var(--line); background:rgba(10,19,26,0.6); padding:22px;
    border-radius:2px; position:relative;
  }
  .conn-form::before, .conn-form::after{
    content:""; position:absolute; width:14px; height:14px; border:1px solid var(--cyan);
    opacity:0.7;
  }
  .conn-form::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .conn-form::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .field label{ display:block; font-size:10px; letter-spacing:0.15em; color:var(--muted); margin-bottom:4px; }
  .field input{
    width:100%; background:var(--bg2); border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:13px; padding:9px 10px; border-radius:1px; outline:none;
  }
  .field input:focus{ border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan-dim); }
  .conn-row{ display:flex; gap:10px; }
  .conn-row .field{ flex:1; }
  #connect-btn{
    margin-top:6px; background:transparent; color:var(--cyan); border:1px solid var(--cyan);
    padding:10px; font-family:var(--mono); letter-spacing:0.2em; font-size:12px; cursor:pointer;
    transition:all .15s ease;
  }
  #connect-btn:hover{ background:rgba(34,232,255,0.12); box-shadow:0 0 16px rgba(34,232,255,0.35); }
  #connect-error{ color:var(--red); font-size:11px; min-height:14px; }
  #connect-hint{ color:var(--muted); font-size:10px; text-align:center; max-width:340px; line-height:1.6; }

  /* ---------------- App shell ---------------- */
  #app{ position:fixed; inset:0; display:none; flex-direction:column; }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  header .id{ display:flex; align-items:center; gap:10px; }
  header .id .name{ font-weight:700; letter-spacing:0.2em; color:var(--cyan); }
  #status-dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  #status-dot.online{ background:var(--green); box-shadow:0 0 8px var(--green); animation:blink 2.4s infinite; }
  #status-dot.connecting{ background:var(--amber); box-shadow:0 0 8px var(--amber); animation:blink 0.8s infinite; }
  #status-dot.offline{ background:var(--red); box-shadow:0 0 8px var(--red); }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  header .status-text{ font-size:10px; letter-spacing:0.15em; color:var(--muted); }
  header .right{ display:flex; align-items:center; gap:18px; font-size:11px; color:var(--muted); }
  header .right #clock{ color:var(--text); letter-spacing:0.05em; }
  header button.icon{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    width:28px; height:28px; cursor:pointer; font-family:var(--mono); border-radius:1px;
  }
  header button.icon:hover{ color:var(--cyan); border-color:var(--cyan); }
  header button.icon.active{ color:var(--cyan); border-color:var(--cyan); box-shadow:0 0 8px rgba(34,232,255,0.4); }

  main{ flex:1; display:flex; min-height:0; }

  /* ---------------- Core visualizer ---------------- */
  #core-wrap{
    width:220px; flex-shrink:0; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; padding-top:36px; gap:18px; border-right:1px solid var(--line);
  }
  #core{ position:relative; width:150px; height:150px; }
  .ring{
    position:absolute; inset:0; border-radius:50%; border:1px solid var(--cyan-dim);
    opacity:0.55;
  }
  .ring.r1{ animation: spin 14s linear infinite; }
  .ring.r2{ inset:16px; animation: spin 10s linear infinite reverse; border-style:dashed; }
  .ring.r3{ inset:34px; animation: spin 7s linear infinite; }
  #core-dot{
    position:absolute; inset:60px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #bffcff, var(--cyan) 45%, var(--cyan-dim) 75%, transparent 100%);
    box-shadow: 0 0 24px 6px rgba(34,232,255,0.55);
    transition: all .4s ease;
  }
  @keyframes spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  #core.thinking .ring{ border-color:var(--amber); }
  #core.thinking .ring.r1{ animation-duration:3s; }
  #core.thinking .ring.r2{ animation-duration:2.2s; }
  #core.thinking .ring.r3{ animation-duration:1.4s; }
  #core.thinking #core-dot{
    background: radial-gradient(circle at 35% 30%, #fff3d8, var(--amber) 45%, #a86a0f 75%, transparent 100%);
    box-shadow: 0 0 30px 10px rgba(255,176,32,0.6);
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }
  #core-label{ font-size:10px; letter-spacing:0.2em; color:var(--muted); text-align:center; }
  #core-label b{ color:var(--cyan); display:block; font-size:11px; letter-spacing:0.15em; margin-top:2px;}
  #bars{ display:flex; align-items:flex-end; gap:3px; height:26px; }
  #bars span{ width:3px; background:var(--cyan-dim); height:20%; transition:height .15s ease; }
  #core.thinking ~ #bars span, #core-wrap.thinking #bars span{ background:var(--amber); }

  /* ---------------- Chat ---------------- */
  #chat-col{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #log{ flex:1; overflow-y:auto; padding:22px 26px; display:flex; flex-direction:column; gap:16px; }
  .msg{ max-width:720px; }
  .msg .meta{ font-size:10px; letter-spacing:0.1em; color:var(--muted); margin-bottom:4px; }
  .msg.user .meta{ color:var(--cyan-dim); }
  .msg .bubble{ font-size:13.5px; line-height:1.65; white-space:pre-wrap; }
  .msg.alex .bubble{ color:var(--text); }
  .msg.alex .meta::before{ content:"ALEX_ "; color:var(--cyan); }
  .msg.user .meta::before{ content:"TU_ "; }
  .msg.sys .bubble{ color:var(--muted); font-style:italic; font-size:12px; }

  #input-row{
    display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--line); flex-shrink:0;
    align-items:center;
  }
  #input-row .prompt{ color:var(--cyan); font-size:14px; }
  #msg-input{
    flex:1; background:transparent; border:none; color:var(--text); font-family:var(--mono);
    font-size:14px; outline:none;
  }
  #msg-input::placeholder{ color:var(--muted); }
  #send-btn{
    background:transparent; border:1px solid var(--cyan-dim); color:var(--cyan);
    font-family:var(--mono); font-size:11px; letter-spacing:0.15em; padding:9px 16px; cursor:pointer;
  }
  #send-btn:hover{ border-color:var(--cyan); box-shadow:0 0 12px rgba(34,232,255,0.3); }
  #send-btn:disabled{ opacity:0.35; cursor:default; box-shadow:none; }

  /* ---------------- Toasts ---------------- */
  #toast-container{
    position:fixed; top:18px; right:18px; display:flex; flex-direction:column; gap:10px;
    z-index:100; width:min(340px, 90vw);
  }
  .toast{
    background:rgba(7,13,19,0.95); border:1px solid var(--cyan-dim); border-left:3px solid var(--cyan);
    padding:12px 14px; font-size:12px; animation: slidein .25s ease;
  }
  .toast.p0{ border-left-color:var(--muted); }
  .toast.p1{ border-left-color:var(--cyan); }
  .toast.p2{ border-left-color:var(--amber); }
  .toast.p3{ border-left-color:var(--red); box-shadow:0 0 18px rgba(255,59,92,0.25); }
  .toast .t-title{ letter-spacing:0.08em; font-weight:700; margin-bottom:4px; }
  .toast.p3 .t-title{ color:var(--red); }
  .toast.p2 .t-title{ color:var(--amber); }
  .toast .t-body{ color:var(--text); line-height:1.5; margin-bottom:8px; }
  .toast .t-src{ color:var(--muted); font-size:9px; letter-spacing:0.1em; margin-bottom:8px; }
  .toast .t-actions{ display:flex; gap:8px; }
  .toast .t-actions button{
    background:transparent; border:1px solid var(--line); color:var(--text); font-family:var(--mono);
    font-size:10px; padding:5px 10px; cursor:pointer;
  }
  .toast .t-actions button:hover{ border-color:var(--cyan); color:var(--cyan); }
  @keyframes slidein{ from{ transform:translateX(20px); opacity:0; } to{ transform:translateX(0); opacity:1; } }

  @media (max-width: 640px){
    #core-wrap{ display:none; }
  }
</style>
</head>
<body>

  <div id="connect-screen">
    <div class="brand glow-text">ALEX</div>
    <div class="sub">PERSONAL AI CONSOLE</div>
    <div class="conn-form">
      <div class="conn-row">
        <div class="field">
          <label>HOST</label>
          <input id="in-host" placeholder="raspberrypi.local" />
        </div>
        <div class="field" style="max-width:90px;">
          <label>PUERTO</label>
          <input id="in-port" placeholder="8787" />
        </div>
      </div>
      <div class="field">
        <label>TOKEN</label>
        <input id="in-token" type="password" placeholder="ALEX_API_TOKEN" />
      </div>
      <button id="connect-btn">CONECTAR ▸</button>
      <div id="connect-error"></div>
    </div>
    <div id="connect-hint">La direccion y el token se guardan solo en este navegador (localStorage).
      Encuentra el token en el .env de tu Raspberry Pi (ALEX_API_TOKEN). Deja el puerto
      vacio si accedes por HTTPS a traves de un proxy (ej. <code>tailscale serve</code>).</div>
  </div>

  <div id="app">
    <header>
      <div class="id">
        <span id="status-dot" class="offline"></span>
        <span class="name">ALEX</span>
        <span class="status-text" id="status-text">DESCONECTADO</span>
      </div>
      <div class="right">
        <span id="clock">--:--:--</span>
        <button class="icon" id="push-btn" title="Activar notificaciones push" style="display:none;">🔔</button>
        <button class="icon" id="settings-btn" title="Cambiar conexion">⚙</button>
      </div>
    </header>
    <main>
      <div id="core-wrap">
        <div id="core">
          <div class="ring r1"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div id="core-dot"></div>
        </div>
        <div id="bars">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div id="core-label">ESTADO<b id="core-state">EN ESPERA</b></div>
      </div>
      <div id="chat-col">
        <div id="log"></div>
        <div id="input-row">
          <span class="prompt">›</span>
          <input id="msg-input" autocomplete="off" placeholder="escribe un mensaje para ALEX..." />
          <button id="send-btn">ENVIAR</button>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const connectScreen = $("connect-screen");
  const app = $("app");
  const log = $("log");
  const statusDot = $("status-dot");
  const statusText = $("status-text");
  const core = $("core");
  const coreState = $("core-state");
  const msgInput = $("msg-input");
  const sendBtn = $("send-btn");
  const toastContainer = $("toast-container");

  let ws = null;
  let reconnectDelay = 1500;
  let reconnectTimer = null;
  let clientId = "web-" + Math.random().toString(36).slice(2, 8);

  function cfg() {
    return {
      host: localStorage.getItem("alex_host") || "",
      // No forced "8787" fallback: an empty port means "use the scheme's
      // default port" (443/80), needed when ALEX sits behind a reverse
      // proxy (e.g. `tailscale serve`) rather than being hit directly.
      port: localStorage.getItem("alex_port") || "",
      token: localStorage.getItem("alex_token") || "",
    };
  }

  // Reuses whatever scheme this page itself was loaded with, so the
  // console keeps working whether ALEX is reached over plain http:// (LAN)
  // or https:// (behind a TLS-terminating proxy) - hardcoding one broke
  // the other, and https pages can't fetch() http:// resources anyway
  // (mixed content is blocked by the browser).
  function hostPort() {
    const c = cfg();
    return c.port ? `${c.host}:${c.port}` : c.host;
  }

  function apiBase() {
    const proto = location.protocol === "https:" ? "https" : "http";
    return `${proto}://${hostPort()}`;
  }

  function wsUrl() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    return `${proto}://${hostPort()}/ws?token=${encodeURIComponent(cfg().token)}&client_id=${clientId}`;
  }

  // ---------------- Connect screen ----------------
  function showConnectScreen(errorMsg) {
    const c = cfg();
    $("in-host").value = c.host;
    $("in-port").value = c.port;
    $("in-token").value = c.token;
    $("connect-error").textContent = errorMsg || "";
    connectScreen.style.display = "flex";
    app.style.display = "none";
  }

  $("connect-btn").addEventListener("click", () => {
    const host = $("in-host").value.trim();
    const port = $("in-port").value.trim();
    const token = $("in-token").value.trim();
    if (!host) {
      $("connect-error").textContent = "Falta el host de la Raspberry Pi.";
      return;
    }
    localStorage.setItem("alex_host", host);
    localStorage.setItem("alex_port", port);
    localStorage.setItem("alex_token", token);
    boot();
  });

  ["in-host", "in-port", "in-token"].forEach((id) => {
    $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") $("connect-btn").click(); });
  });

  $("settings-btn").addEventListener("click", () => {
    if (ws) { try { ws.close(); } catch (e) {} }
    showConnectScreen();
  });

  // ---------------- Chat log ----------------
  function addMessage(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = new Date().toLocaleTimeString();
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  let pendingReplyTimer = null;

  function setThinking(on) {
    core.classList.toggle("thinking", on);
    coreState.textContent = on ? "PROCESANDO" : "EN ESPERA";
    sendBtn.disabled = on;
    msgInput.disabled = on;
    clearTimeout(pendingReplyTimer);
    if (on) {
      // Safety net: if no chat.reply/error ever arrives (dropped connection,
      // server hang, etc.) don't leave the UI stuck "thinking" forever.
      pendingReplyTimer = setTimeout(() => {
        setThinking(false);
        addMessage("sys", "ALEX no respondio a tiempo. Puede que la peticion siga en curso en el servidor - revisa antes de reintentar.");
      }, 90000);
    }
  }

  // ---------------- Status ----------------
  function setStatus(state) {
    statusDot.className = state;
    statusText.textContent = { online: "EN LINEA", connecting: "CONECTANDO", offline: "DESCONECTADO" }[state];
  }

  // ---------------- Toasts ----------------
  function showToast(n) {
    const el = document.createElement("div");
    el.className = "toast p" + (n.priority ?? 1);
    const title = document.createElement("div");
    title.className = "t-title";
    title.textContent = n.title;
    const src = document.createElement("div");
    src.className = "t-src";
    src.textContent = "// " + (n.source || "alex");
    const body = document.createElement("div");
    body.className = "t-body";
    body.textContent = n.body;
    el.appendChild(title); el.appendChild(src); el.appendChild(body);

    const actions = n.actions && n.actions.length ? n.actions : [{ id: "dismiss", label: "Entendido" }];
    const actionsEl = document.createElement("div");
    actionsEl.className = "t-actions";
    actions.forEach((a) => {
      const btn = document.createElement("button");
      btn.textContent = a.label || a.id;
      btn.addEventListener("click", async () => {
        try {
          if (a.action_id) {
            await fetch(`${apiBase()}/actions/${a.action_id}/confirm`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg().token },
              body: JSON.stringify({ approved: a.id === "confirm" }),
            });
          }
          if (n.id) {
            await fetch(`${apiBase()}/notifications/${n.id}/status`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg().token },
              body: JSON.stringify({ status: a.id === "confirm" ? "acted" : "dismissed" }),
            });
          }
        } catch (e) { console.error(e); }
        el.remove();
      });
      actionsEl.appendChild(btn);
    });
    el.appendChild(actionsEl);
    toastContainer.appendChild(el);

    if ((n.priority ?? 1) < 2) {
      setTimeout(() => el.remove(), 12000);
    }
  }

  // ---------------- Web Push ----------------
  // Reaches this device even while the console isn't open (e.g. installed
  // as a home-screen app on iOS 16.4+) - the WebSocket above only works
  // while a tab/app is actually running. Requires a secure context
  // (https:// or localhost) and the server to have VAPID keys configured
  // (see scripts/gen_vapid_keys.py) - the button just hides itself if
  // either isn't true, rather than erroring.
  const pushBtn = $("push-btn");

  function pushSupported() {
    return window.isSecureContext && "serviceWorker" in navigator && "PushManager" in window;
  }

  function urlBase64ToUint8Array(base64) {
    const padded = base64 + "=".repeat((4 - (base64.length % 4)) % 4);
    const raw = atob(padded.replace(/-/g, "+").replace(/_/g, "/"));
    return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
  }

  async function getExistingPushSubscription() {
    if (!pushSupported()) return null;
    const reg = await navigator.serviceWorker.ready.catch(() => null);
    return reg ? reg.pushManager.getSubscription() : null;
  }

  async function updatePushButton() {
    if (!pushSupported()) { pushBtn.style.display = "none"; return; }
    pushBtn.style.display = "";
    const sub = await getExistingPushSubscription();
    pushBtn.classList.toggle("active", !!sub);
    pushBtn.title = sub ? "Notificaciones activas (pulsa para desactivar)" : "Activar notificaciones push";
  }

  async function subscribeToPush() {
    const reg = await navigator.serviceWorker.ready;
    const res = await fetch(`${apiBase()}/push/vapid_public_key`, {
      headers: { "Authorization": "Bearer " + cfg().token },
    });
    const data = await res.json();
    if (!data.configured) {
      addMessage("sys", "El servidor no tiene Web Push configurado (faltan las claves VAPID - ver scripts/gen_vapid_keys.py).");
      return;
    }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(data.public_key),
    });
    const json = sub.toJSON();
    await fetch(`${apiBase()}/push/subscribe`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg().token },
      body: JSON.stringify({ endpoint: json.endpoint, keys: json.keys }),
    });
    addMessage("sys", "Notificaciones push activadas en este dispositivo.");
  }

  async function unsubscribeFromPush() {
    const sub = await getExistingPushSubscription();
    if (!sub) return;
    const endpoint = sub.endpoint;
    await sub.unsubscribe();
    await fetch(`${apiBase()}/push/unsubscribe`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg().token },
      body: JSON.stringify({ endpoint }),
    });
    addMessage("sys", "Notificaciones push desactivadas en este dispositivo.");
  }

  pushBtn.addEventListener("click", async () => {
    try {
      if (Notification.permission === "denied") {
        addMessage("sys", "Los permisos de notificacion estan bloqueados para este sitio - revisalos en los ajustes del navegador.");
        return;
      }
      const existing = await getExistingPushSubscription();
      if (existing) {
        await unsubscribeFromPush();
      } else {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") return;
        await subscribeToPush();
      }
    } catch (e) {
      console.error(e);
      addMessage("sys", "Error con las notificaciones push: " + e.message);
    } finally {
      updatePushButton();
    }
  });

  // ---------------- WebSocket ----------------
  function connectWs() {
    setStatus("connecting");
    ws = new WebSocket(wsUrl());

    ws.onopen = () => {
      reconnectDelay = 1500;
      setStatus("online");
      pingLoop();
    };

    ws.onmessage = (evt) => {
      let data;
      try { data = JSON.parse(evt.data); } catch (e) { return; }
      switch (data.type) {
        case "hello":
          addMessage("sys", `Conectado a ${data.assistant_name}.`);
          break;
        case "chat.reply":
          setThinking(false);
          if (data.reply) addMessage("alex", data.reply);
          break;
        case "notification":
          showToast(data.notification);
          break;
        case "action.result":
          addMessage("sys", data.message || "Accion procesada.");
          break;
        case "error":
          setThinking(false);
          addMessage("sys", "Error: " + data.message);
          break;
      }
    };

    ws.onclose = () => {
      setStatus("offline");
      if (core.classList.contains("thinking")) {
        setThinking(false);
        addMessage("sys", "Se perdio la conexion mientras ALEX respondia. Puede que la peticion siga en curso en el servidor - revisa antes de reintentar.");
      }
      scheduleReconnect();
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWs, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.6, 20000);
  }

  function pingLoop() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "ping" }));
    setTimeout(pingLoop, 25000);
  }

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMessage("user", text);
    setThinking(true);
    ws.send(JSON.stringify({ type: "chat.message", text }));
    msgInput.value = "";
  }

  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  // ---------------- Clock + ambient bars ----------------
  setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString(); }, 1000);
  setInterval(() => {
    document.querySelectorAll("#bars span").forEach((s) => {
      s.style.height = (core.classList.contains("thinking") ? (20 + Math.random() * 80) : (10 + Math.random() * 25)) + "%";
    });
  }, 220);

  // ---------------- Boot ----------------
  function boot() {
    const c = cfg();
    if (!c.host) { showConnectScreen(); return; }
    connectScreen.style.display = "none";
    app.style.display = "flex";
    log.innerHTML = "";
    addMessage("sys", "Iniciando enlace con ALEX...");
    connectWs();
    msgInput.focus();
    if (pushSupported()) {
      navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW register failed", e));
    }
    updatePushButton();
  }

  boot();
})();
</script>
</body>
</html>

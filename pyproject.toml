[project]
name = "alex"
version = "0.1.0"
description = "Project ALEX - a permanent, modular personal AI assistant"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
voice = [
    "openwakeword>=0.6",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "sounddevice>=0.4",
    "numpy>=1.26",
]
system = [
    "psutil>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

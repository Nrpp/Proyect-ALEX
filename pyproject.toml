[project]
name = "alex"
version = "0.1.0"
description = "Project ALEX - a permanent, modular personal AI assistant"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
voice = [
    # openwakeword itself is installed separately with --no-deps by
    # scripts/install_raspberry_pi.sh - see requirements-voice.txt for why.
    "onnxruntime>=1.10.0,<2",
    "scipy>=1.3,<2",
    "scikit-learn>=1,<2",
    "requests>=2.0,<3",
    "tqdm>=4,<5",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "sounddevice>=0.4",
    "numpy>=1.26",
]
system = [
    "psutil>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
